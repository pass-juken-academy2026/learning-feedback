<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google-site-verification" content="mi_-sYmWc6J5m40NB-zwtPSApRsXMZXbgUnEJvr-9a4"><title>学習サイト フィードバック</title><style>body{margin:0;background:#f4f7fc;color:#172033;font:16px/1.7 system-ui,sans-serif}header,main{max-width:820px;margin:auto;padding:22px}.card{background:white;border:1px solid #dfe6f1;border-radius:16px;padding:20px;margin:12px 0}label{display:block;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd6e6;border-radius:9px;font:inherit}button{padding:11px 16px;border:0;border-radius:9px;background:#2458c6;color:white;font:inherit;cursor:pointer}.muted{color:#59677d}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fc;padding:12px;border-radius:10px}</style></head><body><header><h1>学習サイトへのフィードバック</h1><p>問題の誤り、表示崩れ、追加してほしい単元などをまとめられます。</p></header><main><section class="card"><form id="form"><label for="site">対象サイト</label><select id="site"><option>中学国語</option><option>中学数学</option><option>中学理科</option><option>中学社会</option><option>高校国語</option><option>高校数学</option><option>高校英語</option><option>高校生物</option><option>高校化学</option><option>高校物理</option><option>高校地学</option><option>高校地理・歴史総合</option><option>高校情報I</option><option>世界史</option><option>日本史</option><option>総合ポータル</option></select><label for="kind">内容</label><select id="kind"><option>問題・解説の誤り</option><option>表示・操作の不具合</option><option>追加してほしい内容</option><option>その他</option></select><label for="detail">内容（個人情報は入力しないでください）</label><textarea id="detail" rows="6" required maxlength="3000" placeholder="どのページで、何が起きたかを書いてください。"></textarea><p class="muted">この静的ページは送信内容をサーバーへ送信しません。入力はこのページ内で文章化するだけです。氏名・メールアドレス・パスワードなどは入力しないでください。</p><button type="submit">フィードバック文を作成</button></form></section><section class="card"><h2>作成した内容</h2><pre id="output" aria-live="polite">フォームに記入して「フィードバック文を作成」を押してください。</pre><button id="copy" type="button">文章をコピー</button><p class="muted">送信機能は未接続です。管理者へ届けるには、認証付きのサーバー側受付先を設定する必要があります。</p></section></main><script>const form=document.getElementById("form"),out=document.getElementById("output");form.addEventListener("submit",e=>{e.preventDefault();out.textContent="【学習サイトへのフィードバック】\n対象："+document.getElementById("site").value+"\n種別："+document.getElementById("kind").value+"\n内容：\n"+document.getElementById("detail").value});document.getElementById("copy").addEventListener("click",async()=>{const text=out.textContent||"";try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);document.getElementById("copy").textContent="コピーしました";return;}}catch(e){}const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);const ok=document.execCommand("copy");s.removeAllRanges();document.getElementById("copy").textContent=ok?"コピーしました":"コピーできません。文章を選択してコピーしてください";});</script></body></html>
